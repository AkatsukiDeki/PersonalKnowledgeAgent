services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pka_vps_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pka_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-pka_db}
    volumes:
      - pka_db_data:/var/lib/postgresql/data
    networks:
      - pka_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pka_user -d pka_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pka_vps_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pka_user}:${POSTGRES_PASSWORD:-pka_secret_password}@db:5432/${POSTGRES_DB:-pka_db}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pka_internal
    ports:
      - "8000:8000"
    volumes:
      - pka_backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: pka_vps_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backend
    networks:
      - pka_internal

networks:
  pka_internal:
    driver: bridge

volumes:
  pka_db_data:
    external: true
    name: pka_postgres_data
  pka_backend_uploads:
