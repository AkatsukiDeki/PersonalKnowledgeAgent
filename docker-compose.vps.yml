services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pka_vps_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pka_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-pka_db}
    volumes:
      - pka_db_data:/var/lib/postgresql/data
    networks:
      - pka_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pka_user -d pka_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pka_vps_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - pka_redis_data:/data
    networks:
      - pka_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pka_vps_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pka_user}:${POSTGRES_PASSWORD:-pka_secret_password}@db:5432/${POSTGRES_DB:-pka_db}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_QA_MODEL: ${OLLAMA_QA_MODEL:-qwen2.5:3b}
      LLM_ROUTING_BACKEND: ${LLM_ROUTING_BACKEND:-local}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      FLAGS_use_mkldnn: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pka_internal
    ports:
      - "8000:8000"
    volumes:
      - pka_backend_uploads:/app/uploads

  worker_media:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pka_vps_worker_media
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pka_user}:${POSTGRES_PASSWORD:-pka_secret_password}@db:5432/${POSTGRES_DB:-pka_db}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_QA_MODEL: ${OLLAMA_QA_MODEL:-qwen2.5:3b}
      LLM_ROUTING_BACKEND: ${LLM_ROUTING_BACKEND:-local}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      FLAGS_use_mkldnn: "0"
      PKA_WHISPER_MODEL: "large-v3-turbo"
      PKA_WHISPER_DEVICE: "cuda"
      PKA_WHISPER_COMPUTE_TYPE: "float16"
      CUDA_VISIBLE_DEVICES: "0"
      TORCH_DEVICE: "cuda"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["arq", "app.tasks.worker.MediaWorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pka_internal
    volumes:
      - pka_backend_uploads:/app/uploads

  worker_knowledge:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pka_vps_worker_knowledge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pka_user}:${POSTGRES_PASSWORD:-pka_secret_password}@db:5432/${POSTGRES_DB:-pka_db}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_QA_MODEL: ${OLLAMA_QA_MODEL:-qwen2.5:3b}
      LLM_ROUTING_BACKEND: ${LLM_ROUTING_BACKEND:-local}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      FLAGS_use_mkldnn: "0"
    command: ["arq", "app.tasks.worker.KnowledgeWorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pka_internal
    volumes:
      - pka_backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: pka_vps_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backend
    networks:
      - pka_internal

networks:
  pka_internal:
    driver: bridge

volumes:
  pka_db_data:
    external: true
    name: pka_postgres_data
  pka_redis_data:
  pka_backend_uploads: