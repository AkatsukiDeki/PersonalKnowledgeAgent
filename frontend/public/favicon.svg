<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="1" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="edgeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 8" stroke-opacity="0.25" />

  <!-- Causal Edges / Connections -->
  <path d="M 256 156 Q 320 180 376 256" fill="none" stroke="url(#edgeGrad1)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 376 256 Q 300 340 256 356" fill="none" stroke="url(#edgeGrad1)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 256 356 Q 160 310 136 256" fill="none" stroke="url(#edgeGrad2)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 136 256 Q 180 160 256 156" fill="none" stroke="url(#edgeGrad2)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Orbiting Nodes -->
  <circle cx="376" cy="256" r="14" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="256" cy="356" r="12" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="136" cy="256" r="16" fill="#ec4899" filter="url(#glow)" />
  <circle cx="256" cy="156" r="10" fill="#f59e0b" filter="url(#glow)" />

  <!-- Core Star -->
  <circle cx="256" cy="256" r="70" fill="url(#coreGlow)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="30" fill="#ffffff" filter="url(#glow)" />
</svg>
